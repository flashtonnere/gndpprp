<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Région de Gendarmerie d’Ile de France</title>
<style>
:root{--bg:#f1f4fa;--card:#fff;--tx:#10213f;--mu:#5b6985;--bd:#d6dded;--ac:#1b3a8c;--act:#fff;--dg:#c62828;--ok:#2e7d32}
@media (prefers-color-scheme:dark){:root{--bg:#0a1122;--card:#121b30;--tx:#e6ecf8;--mu:#93a1bd;--bd:#25314c;--ac:#5b8cff;--act:#07132e;--dg:#ff6b6b;--ok:#5fd37a}}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;min-height:100vh;padding-top:env(safe-area-inset-top,0px)}
main{flex:1;width:100%;max-width:900px;margin:0 auto;padding:16px}
.bar{height:6px;background:linear-gradient(90deg,#1b3a8c 33%,#fff 33% 66%,#d32f2f 66%)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
h1{font-size:22px;margin:0 0 6px}h2{font-size:17px;margin:0 0 10px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{padding:9px 14px;border:0;border-radius:8px;background:var(--ac);color:var(--act);font:inherit;font-weight:600;cursor:pointer;margin-top:10px}
button.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.d{background:var(--dg);color:#fff;padding:5px 10px;margin:0;font-size:13px}
button.k{padding:5px 10px;margin:0;font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tabs button{margin:0}.tabs button:not(.on){background:transparent;color:var(--tx);border:1px solid var(--bd)}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:12px;color:var(--mu);text-transform:uppercase}
.b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.on-d{background:var(--ok);color:#fff}.off-d{background:var(--bd);color:var(--mu)}
.mu{color:var(--mu);font-size:13px}.err{color:var(--dg);font-size:13px;min-height:18px;margin-top:6px}
.rep{border-top:1px solid var(--bd);padding:10px 0}.rep p{margin:4px 0;white-space:pre-wrap}
a{color:var(--ac)}.modal{position:fixed;inset:0;z-index:50;background:rgba(5,10,25,.65);display:flex;align-items:center;justify-content:center;padding:16px}.modal .card{width:100%;max-width:520px;max-height:88vh;overflow:auto;margin:0}.tm{font-variant-numeric:tabular-nums}.hid{display:none}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;padding:9vh 16px 36px;color:#fff;text-align:center;
background:radial-gradient(ellipse at 50% 0,rgba(91,140,255,.35),transparent 60%),linear-gradient(180deg,rgba(5,14,40,.9),rgba(9,28,76,.95)),repeating-linear-gradient(135deg,#0b1f55 0 14px,#0e2a68 14px 28px)}
.hero.hid{display:none}.hero h1{font-size:clamp(24px,5vw,38px);max-width:700px;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.hero p{opacity:.85;max-width:520px}.hero button{background:#fff;color:#0b1f55;padding:12px 26px;font-size:16px}
.ann{max-width:720px;width:100%;text-align:left;margin-top:34px}.ann h2{text-align:center}
.ann-card{background:rgba(127,127,127,.14);border:1px solid rgba(127,127,127,.3);border-left:4px solid var(--c);border-radius:10px;padding:12px 14px;margin-bottom:10px}
#auth{max-width:380px;margin:6vh auto 0}
footer{text-align:center;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));color:var(--mu);font-size:13px;border-top:1px solid var(--bd)}
</style>
</head>
<body>
<div class="bar"></div>
<section id="home" class="hero">
  <div id="logo" style="font-size:60px"></div>
  <h1>Région de Gendarmerie d’Ile de France</h1>
  <p>Espace de gestion interne : effectif, rapports, annonces et comptes des agents.</p>
  <button id="enter">Accéder à l’espace agents</button>
  <div class="ann" id="homeAnn"></div>
</section>
<main id="main" class="hid">

  <section id="auth" class="card hid">
    <h1 id="atitle">Connexion</h1>
    <label>Identifiant</label><input id="u" autocomplete="username">
    <label>Mot de passe</label><input id="p" type="password" autocomplete="current-password">
    <div id="reg" class="hid"><label>Nom RP (prénom nom)</label><input id="nm"><label>RIO</label><input id="mt"></div>
    <div class="err" id="err"></div>
    <button id="go" style="width:100%">Connexion</button>
    <p class="mu" style="text-align:center"><a href="#" id="sw">Demande d’accès (nouveau compte)</a> · <a href="#" id="bk">Accueil</a></p>
  </section>

  <section id="app" class="hid">
    <div class="top card">
      <div><h1><span id="logo2"></span> Gendarmerie IDF</h1><span class="mu" id="who"></span></div>
      <div><button class="s" id="duty">Prise de service</button> <button class="s" id="out">Déconnexion</button></div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
  </section>
</main>
<footer>Réalisé par flashtonnere pour un serveur Five M</footer>

const GRADES=["Gendarme Adjoint de 2nd Classe","Brigadier","Brigadier-Chef","Maréchal des Logis","Gendarme Sous Contrat","Gendarme de Carrière","Maréchal des Logis Chef","Adjudant","Adjudant Chef","Major","Sous Lieutenant","Lieutenant","Capitaine","Chef d’Escadron","Lieutenant-Colonel","Colonel","Général de Brigade","Général de Division","Général de Corps d’Armée","Général d’Armée"];
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mail=u=>u.trim().toLowerCase().replace(/[^a-z0-9._-]/g,"")+"@"+EMAIL_DOMAIN;
let me=null,tab="eff",mode="login";
function show(v){["home","auth","app"].forEach(x=>$(x).classList.toggle("hid",x!==v));$("main").classList.toggle("hid",v==="home");if(v==="home")loadHome()}
function setMode(m){mode=m;$("reg").classList.toggle("hid",m!=="reg");$("atitle").textContent=m==="reg"?"Demande d’accès":"Connexion";
  $("go").textContent=m==="reg"?"Envoyer la demande":"Connexion";$("sw").textContent=m==="reg"?"J’ai déjà un compte":"Demande d’accès (nouveau compte)";$("err").textContent=""}
$("enter").onclick=()=>show("auth");$("bk").onclick=e=>{e.preventDefault();show("home")};
$("sw").onclick=e=>{e.preventDefault();setMode(mode==="reg"?"login":"reg")};
$("go").onclick=async()=>{
  const u=$("u").value.trim(),p=$("p").value;$("err").textContent="";
  if(!u||p.length<6){$("err").textContent="Identifiant requis, mot de passe de 6 caractères minimum.";return}
  if(mode==="reg"){
    const {error}=await sb.auth.signUp({email:mail(u),password:p,options:{data:{nom:$("nm").value.trim()||u,mat:$("mt").value.trim()||"—"}}});
    if(error){$("err").textContent=error.message;return}
    await sb.auth.signOut();setMode("login");$("err").textContent="Demande envoyée. Un administrateur doit valider votre compte avant la connexion.";return;
  }
  const {error}=await sb.auth.signInWithPassword({email:mail(u),password:p});
  if(error){$("err").textContent="Identifiant ou mot de passe incorrect.";return}
  start();
};
async function start(){
  const {data:{user}}=await sb.auth.getUser();if(!user){show("auth");return}
  await sb.rpc("close_stale");
  const {data}=await sb.from("profiles").select("*").eq("id",user.id).single();
  me=data;if(!me){await sb.auth.signOut();show("auth");return}
  tab="eff";show("app");render();
}
$("out").onclick=async()=>{await sb.auth.signOut();me=null;$("p").value="";show("home")};
$("duty").onclick=async()=>{await sb.rpc(me.duty?"fin_service":"debut_service");await refreshMe();render()};
async function render(){
  if(!me.approved){
    $("who").textContent=me.nom;$("duty").classList.add("hid");$("tabs").innerHTML="";
    $("view").innerHTML='<div class="card"><h2>Compte en attente de validation</h2><p class="mu">Un administrateur doit approuver votre accès. Reconnectez-vous plus tard.</p></div>';return}
  $("duty").classList.remove("hid");
  $("who").textContent=`${me.nom} · ${me.grade} · RIO ${me.mat}`;
  $("duty").textContent=me.duty?"Fin de service":"Prise de service";
  const t=[["eff","Effectif"],["svc","Temps de service"],["rep","Rapports"],["ann","Annonces"],["pwd","Mot de passe"]];if(me.is_admin)t.push(["adm","Comptes"]);
  $("tabs").innerHTML=t.map(([k,l])=>`<button class="${tab===k?"on":""}" data-t="${k}">${l}</button>`).join("");
  $("view").innerHTML='<p class="mu">Chargement…</p>';
  $("view").innerHTML=tab==="eff"?await vEff():tab==="svc"?await vSvc():tab==="rep"?await vRep():tab==="ann"?await vAnn():tab==="pwd"?vPwd():await vAdm();
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b||!me)return;const d=b.dataset;
  if(d.t){tab=d.t;render()}
  else if(b.id==="radd"){const t=$("rt").value.trim(),x=$("rd").value.trim();if(!t||!x)return;
    await sb.from("reports").insert({titre:t,type:$("ry").value,details:x,preuve:$("rp").value.trim(),auteur_nom:me.nom});render()}
  else if(b.id==="anadd"){const t=$("at").value.trim(),x=$("ac").value.trim();if(!t||!x)return;
    await sb.from("annonces").insert({titre:t,type:$("ay").value,contenu:x,auteur_nom:me.nom});render()}
  else if(d.adel){await sb.from("annonces").delete().eq("id",d.adel);render()}
  else if(b.id==="pwgo"){const a=$("pw1").value,c=$("pw2").value,er=$("perr");er.style.color="";
    if(a.length<6){er.textContent="6 caractères minimum.";return}
    if(a!==c){er.textContent="Les deux mots de passe ne correspondent pas.";return}
    const {error}=await sb.auth.updateUser({password:a});
    if(error){er.textContent=error.message;return}
    er.style.color="var(--ok)";er.textContent="Mot de passe modifié.";$("pw1").value="";$("pw2").value=""}
  else if(b.id==="rsgo"){const id=$("rsu").value,p=$("rsp").value,er=$("rserr");er.style.color="";
    if(!id||p.length<6){er.textContent="Choisissez un agent et un mot de passe de 6 caractères min.";return}
    const {error}=await sb.rpc("admin_reset_password",{target:id,new_pw:p});
    if(error){er.textContent=error.message;return}
    er.style.color="var(--ok)";er.textContent="Mot de passe réinitialisé. Communiquez-le à l’agent.";$("rsp").value=""}
  else if(d.cu){editU=d.cu;render()}
  else if(b.id==="ocl"){editU=null;render()}
  else if(b.id==="osave"){const rio=$("orio").value.trim()||"—";const ids=[...document.querySelectorAll("[data-cb]:checked")].map(x=>Number(x.dataset.cb));
    await sb.from("profiles").update({opts:ids,mat:rio}).eq("id",d.id);if(d.id===me.id)me.mat=rio;editU=null;render()}
  else if(d.oadd){const v=$("new_"+d.oadd).value.trim();if(!v)return;await sb.from("options").insert({categorie:d.oadd,libelle:v});render()}
  else if(d.orn){const v=$("o"+d.orn).value.trim();if(!v)return;await sb.from("options").update({libelle:v}).eq("id",d.orn);render()}
  else if(d.odel){await sb.from("options").delete().eq("id",d.odel);render()}
  else if(d.tadj){editT=d.tadj;render()}
  else if(b.id==="tcl"){editT=null;render()}
  else if(b.id==="tgo"){const er=$("terr");er.style.color="";
    const mn=((+$("th").value||0)*60+(+$("tmn").value||0))*Number($("ts").value),day=$("td").value;
    if(!mn||!day){er.textContent="Indiquez une durée et un jour.";return}
    if(Math.abs(mn)>1440){er.textContent="24 h maximum par ajustement.";return}
    const {error}=await sb.from("ajustements").insert({agent_id:d.id,jour:day,minutes:mn,note:$("tn").value.trim(),auteur_nom:me.nom});
    if(error){er.textContent=error.message;return}render()}
  else if(d.tdel){await sb.from("ajustements").delete().eq("id",d.tdel);render()}
  else if(d.del){await sb.from("reports").delete().eq("id",d.del);render()}
  else if(d.ap){await sb.from("profiles").update({approved:d.ap==="1"}).eq("id",d.id);render()}
  else if(b.id==="aadd"){
    const u=$("nu").value.trim(),p=$("np").value;
    if(!u||p.length<6){$("aerr").textContent="Identifiant et mot de passe (6 caractères min.) requis.";return}
    const tmp=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
    const {data,error}=await tmp.auth.signUp({email:mail(u),password:p,options:{data:{nom:$("nn").value.trim()||u,mat:$("nm2").value.trim()||"—",grade:$("ng").value}}});
    if(error||!data.user){$("aerr").textContent=error?error.message:"Échec de la création.";return}
    await sb.from("profiles").update({approved:true,grade:$("ng").value,mat:$("nm2").value.trim()||"—",nom:$("nn").value.trim()||u}).eq("id",data.user.id);render()}
});
document.addEventListener("click",e=>{if(e.target.id==="modal"){editU=null;editT=null;render()}});
document.addEventListener("change",async e=>{const s=e.target.closest("[data-g]");if(s)await sb.from("profiles").update({grade:s.value}).eq("id",s.dataset.g)});
const COL={Information:"#5b8cff",Important:"#f5a623",Urgent:"#ff5252"};
function annItem(a,del){return `<div class="ann-card" style="--c:${COL[a.type]||COL.Information}"><div class="top"><b>${esc(a.titre)}</b><span style="opacity:.75;font-size:13px">${esc(a.type)} · ${new Date(a.created_at).toLocaleDateString("fr-FR")}</span></div><p style="margin:6px 0;white-space:pre-wrap">${esc(a.contenu)}</p><span style="opacity:.7;font-size:13px">Par ${esc(a.auteur_nom)}</span>${del?` <button class="d" data-adel="${a.id}">Supprimer</button>`:""}</div>`}
async function loadHome(){const r=await sb.from("annonces").select("*").order("created_at",{ascending:false});const l=r.data||[];
  $("homeAnn").innerHTML=!r.error&&l.length?"<h2>Annonces</h2>"+l.slice(0,3).map(a=>annItem(a)).join(""):""}
async function vAnn(){const r=await sb.from("annonces").select("*").order("created_at",{ascending:false});const l=r.data||[];
  return (me.is_admin?`<div class="card"><h2>Nouvelle annonce</h2><label>Titre</label><input id="at"><label>Type</label><select id="ay"><option>Information</option><option>Important</option><option>Urgent</option></select><label>Message</label><textarea id="ac" rows="4"></textarea><button id="anadd">Publier l’annonce</button></div>`:"")+`<div class="card"><h2>Annonces (${l.length})</h2>`+(l.length?l.map(a=>annItem(a,me.is_admin)).join(""):'<p class="mu">Aucune annonce.</p>')+`</div>`}
function vPwd(){return `<div class="card"><h2>Changer mon mot de passe</h2><label>Nouveau mot de passe</label><input id="pw1" type="password" autocomplete="new-password"><label>Confirmer le mot de passe</label><input id="pw2" type="password" autocomplete="new-password"><div class="err" id="perr"></div><button id="pwgo">Modifier mon mot de passe</button></div>`}
const canMod=()=>me.is_admin||["Colonel","Lieutenant-Colonel"].includes(me.grade);
const pday=()=>new Date().toLocaleDateString("sv-SE",{timeZone:"Europe/Paris"});
const fmt=n=>{n=Math.max(0,Math.floor(n));const h=Math.floor(n/3600),m=Math.floor(n%3600/60),sc=n%60;return [h,m,sc].map(x=>String(x).padStart(2,"0")).join(":")};
const fmtHM=min=>{min=Math.abs(min);return `${Math.floor(min/60)} h ${String(min%60).padStart(2,"0")} min`};
let editT=null,T0=Date.now(),DAYLAST=pday();
async function refreshMe(){const {data}=await sb.from("profiles").select("*").eq("id",me.id).single();if(data)me=data}
async function midnight(){await sb.rpc("close_stale");await refreshMe();render()}
async function vSvc(){
  await sb.rpc("close_stale");await refreshMe();$("duty").textContent=me.duty?"Fin de service":"Prise de service";
  const [a,b]=await Promise.all([sb.from("profiles").select("*").eq("approved",true),sb.rpc("temps_service")]);
  const T={};(b.data||[]).forEach(r=>T[r.aid]={j:Number(r.jour_s),w:Number(r.sem_s)});
  const l=(a.data||[]).sort((x,y)=>GRADES.indexOf(y.grade)-GRADES.indexOf(x.grade));
  T0=Date.now();
  const v=(u,k)=>(T[u.id]||{j:0,w:0})[k];
  const cell=(u,k)=>`<span class="tm" data-b="${v(u,k)}" data-on="${u.duty?1:0}">${fmt(v(u,k))}</span>`;
  const big="font-size:30px;font-weight:700";
  let modal="";
  if(editT&&canMod()){
    const u=l.find(x=>x.id===editT);
    if(u){const r=await sb.from("ajustements").select("*").eq("agent_id",editT).order("created_at",{ascending:false});const ad=(r.data||[]).slice(0,15);
      modal=`<div class="modal" id="modal"><div class="card"><h2>Ajuster le temps de ${esc(u.nom)}</h2><p class="mu">Aujourd’hui : ${fmt(v(u,"j"))} · Semaine : ${fmt(v(u,"w"))}</p><label>Action</label><select id="ts"><option value="1">Ajouter du temps</option><option value="-1">Retirer du temps</option></select><label>Durée (heures / minutes)</label><div style="display:flex;gap:6px"><input id="th" type="number" min="0" value="0"><input id="tmn" type="number" min="0" max="59" value="0"></div><label>Jour concerné</label><input id="td" type="date" value="${pday()}"><label>Motif (facultatif)</label><input id="tn"><div class="err" id="terr"></div><button id="tgo" data-id="${u.id}">Appliquer</button> <button class="s" id="tcl">Fermer</button>`+
      (ad.length?h3("Historique des ajustements")+ad.map(x=>`<div class="rep"><div class="top"><span>${x.minutes>0?"+":"−"}${fmtHM(x.minutes)} · ${esc(x.jour)}</span><button class="d" data-tdel="${x.id}">Supprimer</button></div><span class="mu">${esc(x.note||"Sans motif")} · par ${esc(x.auteur_nom)}</span></div>`).join(""):"")+`</div></div>`}
  }
  return modal+`<div class="card"><h2>Mon temps de service</h2><div style="display:flex;gap:28px;flex-wrap:wrap"><div><div class="mu">Aujourd’hui</div><div style="${big}">${cell(me,"j")}</div></div><div><div class="mu">Cette semaine</div><div style="${big}">${cell(me,"w")}</div></div></div><p class="mu">Le compteur tourne tant que vous êtes en service et s’arrête automatiquement à 00h00 (heure de Paris) : pensez à reprendre votre service après minuit. La semaine va du lundi au dimanche.</p></div>`+
  `<div class="card"><h2>Temps de service de l’effectif</h2><div class="scroll"><table><tr><th>Agent</th><th>Grade</th><th>Aujourd’hui</th><th>Semaine</th><th>Statut</th>${canMod()?"<th></th>":""}</tr>`+
  l.map(u=>`<tr><td>${esc(u.nom)}</td><td>${esc(u.grade)}</td><td>${cell(u,"j")}</td><td>${cell(u,"w")}</td><td><span class="b ${u.duty?"on-d":"off-d"}">${u.duty?"En service":"Hors service"}</span></td>${canMod()?`<td><button class="k" data-tadj="${u.id}">Ajuster</button></td>`:""}</tr>`).join("")+`</table></div></div>`;
}
async function vEff(){
  const {data:l=[]}=await sb.from("profiles").select("*").eq("approved",true);
  const {data:od}=await sb.from("options").select("*");const o=od||[];
  l.sort((a,b)=>GRADES.indexOf(b.grade)-GRADES.indexOf(a.grade));
  return `<div class="card"><h2>Effectif (${l.length}) · ${l.filter(u=>u.duty).length} en service</h2><div class="scroll"><table><tr><th>RIO</th><th>Nom</th><th>Grade</th>${CATS.map(c=>`<th>${c[1]}</th>`).join("")}<th>Statut</th></tr>`+
  l.map(u=>`<tr><td>${esc(u.mat)}</td><td>${esc(u.nom)}</td><td>${esc(u.grade)}</td>${CATS.map(c=>`<td>${chips(u,o,c[0])}</td>`).join("")}<td><span class="b ${u.duty?"on-d":"off-d"}">${u.duty?"En service":"Hors service"}</span></td></tr>`).join("")+`</table></div></div>`;
}
async function vRep(){
  const {data:l=[]}=await sb.from("reports").select("*").order("created_at",{ascending:false});
  return `<div class="card"><h2>Nouveau rapport</h2><label>Titre</label><input id="rt"><label>Type</label><select id="ry"><option>Intervention</option><option>Arrestation</option><option>Contrôle routier</option><option>Plainte</option><option>Autre</option></select><label>Détails</label><textarea id="rd" rows="4"></textarea><label>Lien de preuve (image, vidéo… facultatif)</label><input id="rp" placeholder="https://"><button id="radd">Enregistrer le rapport</button></div>`+
  `<div class="card"><h2>Rapports (${l.length})</h2>`+(l.length?l.map(r=>`<div class="rep"><div class="top"><b>${esc(r.titre)}</b><span class="mu">${esc(r.type)} · ${new Date(r.created_at).toLocaleString("fr-FR")}</span></div><p>${esc(r.details)}</p>${/^https?:\/\//.test(r.preuve||"")?`<a href="${esc(r.preuve)}" target="_blank" rel="noopener noreferrer">Voir la preuve</a><br>`:""}<span class="mu">Par ${esc(r.auteur_nom)}</span> ${canMod()?`<button class="d" data-del="${r.id}">Supprimer</button>`:""}</div>`).join(""):'<p class="mu">Aucun rapport pour le moment.</p>')+`</div>`;
}
const CATS=[["COMMANDEMENT","Commandement"],["SPECIALITE","Spécialités"],["HABILITATION","Habilitations"]];
const chips=(u,o,c)=>(u.opts||[]).map(id=>o.find(x=>x.id===id&&x.categorie===c)).filter(Boolean).map(x=>`<span class="b off-d" style="margin:1px">${esc(x.libelle)}</span>`).join("")||'<span class="mu">—</span>';
let editU=null;
const h3=t=>`<h3 style="font-size:15px;margin:14px 0 6px">${t}</h3>`;
async function vAdm(){
  const base=await vAdm0();
  const {data:od}=await sb.from("options").select("*").order("id");const o=od||[];
  let top="";
  if(editU){
    const {data:pl}=await sb.from("profiles").select("*").eq("id",editU);const u=(pl||[])[0];
    if(u)top=`<div class="modal" id="modal"><div class="card"><h2>Modifier ${esc(u.nom)}</h2><label>RIO</label><input id="orio" value="${esc(u.mat)}">`+CATS.map(([k,lab])=>{const it=o.filter(x=>x.categorie===k);
      return h3(lab)+(it.length?it.map(x=>`<label style="display:flex;gap:8px;align-items:center;color:var(--tx);font-size:15px"><input type="checkbox" style="width:auto" data-cb="${x.id}" ${(u.opts||[]).includes(x.id)?"checked":""}> ${esc(x.libelle)}</label>`).join(""):'<p class="mu">Liste vide : ajoutez des éléments plus bas.</p>')}).join("")+`<button id="osave" data-id="${u.id}">Enregistrer</button> <button class="s" id="ocl">Fermer</button></div></div>`;
  }
  const lists=`<div class="card"><h2>Listes : commandement, spécialités, habilitations</h2><p class="mu">Ajoutez, renommez ou supprimez des éléments, sans limite. Un élément supprimé disparaît aussi du profil des agents.</p>`+
    CATS.map(([k,lab])=>h3(lab)+o.filter(x=>x.categorie===k).map(x=>`<div style="display:flex;gap:6px;margin-bottom:6px"><input id="o${x.id}" value="${esc(x.libelle)}"><button class="k" data-orn="${x.id}">OK</button><button class="d" data-odel="${x.id}">Supprimer</button></div>`).join("")+`<div style="display:flex;gap:6px"><input id="new_${k}" placeholder="Nouvel élément"><button class="k" data-oadd="${k}">Ajouter</button></div>`).join("")+`</div>`;
  return top+base+lists;
}
async function vAdm0(){
  const {data:l=[]}=await sb.from("profiles").select("*").order("approved");
  return `<div class="card"><h2>Créer un compte (validé d’office)</h2><label>Identifiant</label><input id="nu"><label>Mot de passe</label><input id="np"><label>Nom RP</label><input id="nn"><label>RIO</label><input id="nm2"><label>Grade</label><select id="ng">${GRADES.map(g=>`<option>${g}</option>`).join("")}</select><div class="err" id="aerr"></div><button id="aadd">Créer le compte</button></div>`+
  `<div class="card"><h2>Réinitialiser un mot de passe</h2><label>Agent</label><select id="rsu">${l.filter(u=>u.id!==me.id).map(u=>`<option value="${u.id}">${esc(u.nom)} (${esc(u.identifiant)})</option>`).join("")}</select><label>Nouveau mot de passe</label><input id="rsp"><div class="err" id="rserr"></div><button id="rsgo">Réinitialiser</button></div>`+`<div class="card"><h2>Gérer les comptes</h2><div class="scroll"><table><tr><th>Id</th><th>Nom</th><th>Grade</th><th>Accès</th><th>RIO / catégories</th></tr>`+l.map(u=>`<tr><td>${esc(u.identifiant)}</td><td>${esc(u.nom)}</td><td><select data-g="${u.id}">${GRADES.map(g=>`<option ${g===u.grade?"selected":""}>${g}</option>`).join("")}</select></td><td>${u.id===me.id?'<span class="mu">vous</span>':u.approved?`<button class="d" data-ap="0" data-id="${u.id}">Révoquer</button>`:`<button class="k" data-ap="1" data-id="${u.id}">Approuver</button>`}</td><td><button class="k" data-cu="${u.id}">Modifier</button></td></tr>`).join("")+`</table></div></div>`;
}
const logo=h=>`<img src="${LOGO_URL}" alt="Logo" style="height:${h}px;vertical-align:middle" onerror="this.replaceWith(document.createTextNode('🛡️'))">`;
$("logo").innerHTML=logo(100);$("logo2").innerHTML=logo(34);
setInterval(()=>{
  document.querySelectorAll(".tm").forEach(e=>{e.textContent=fmt(Number(e.dataset.b)+(e.dataset.on==="1"?Math.floor((Date.now()-T0)/1000):0))});
  if(me&&pday()!==DAYLAST){DAYLAST=pday();midnight()}
},1000);
loadHome();
sb.auth.getSession().then(({data:{session}})=>{if(session){start()}});
</script>
</body>
</html>
